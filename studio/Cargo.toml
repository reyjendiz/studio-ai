[package]
name = "studio"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "Studio"
path = "src/bin/gui.rs"

[[bin]]
name = "studio-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2   # candle and image decoding are unusably slow unoptimised

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1.13.1"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tungstenite = "0.30"
unicode-normalization = "0.1.25"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

[build-dependencies]
winresource = "0.1.34"
